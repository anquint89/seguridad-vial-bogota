# Tuberia del proyecto. Cada etapa declara sus entradas y sus salidas, de modo
# que `dvc repro` rehace solo lo que quedo desactualizado.
#
# Los datos crudos no son una etapa: se descargan con
# `python -m src.extraccion.descargar` y se versionan con `dvc add`, porque
# vienen de un servicio externo cuyo contenido no controlamos. De data/raw en
# adelante todo es derivado y lo produce este pipeline.

stages:

  perfilar:
    cmd: python -m src.exploracion.perfilamiento
    deps:
      - src/exploracion/perfilamiento.py
      - data/raw
    outs:
      - reportes/perfilamiento.json:
          cache: false
      - reportes/figuras/concentracion.png:
          cache: false
      - reportes/figuras/tendencia_tratados.png:
          cache: false

  maqueta:
    cmd: python -m src.tablero.maqueta
    deps:
      - src/tablero/maqueta.py
    outs:
      - reportes/figuras/maqueta_tablero.png:
          cache: false

  panel:
    cmd: python -m src.preparacion.panel
    deps:
      - src/preparacion/panel.py
      - src/preparacion/exposicion.py
      - data/raw
    outs:
      - data/procesado/panel.parquet

  # Dos desvios respecto al resto del pipeline, los dos por el mismo problema
  # de Windows con el cache de DVC en esta ruta de OneDrive:
  #   - Depende del archivo de la malla y no del directorio data/raw, porque
  #     el hash del directorio completo aborta con WinError 3. Ademas la etapa
  #     solo lee esa capa.
  #     Nota: en una maquina Linux, por ejemplo la EC2, no hace falta ninguno
  #     de los dos desvios.
  #   - La salida va con cache: false y se versiona en Git, como ya se hace
  #     con perfilamiento.json y las figuras. Al cachearla, el movimiento del
  #     archivo al cache falla con el mismo WinError 3. Son 2,9 MB.
  vecindad:
    cmd: python -m src.modelos.vecindad
    deps:
      - src/modelos/vecindad.py
      - data/raw/malla_vial_integral.parquet
    outs:
      - data/procesado/vecindad.parquet:
          cache: false

  modelo_conteo:
    cmd: python -m src.modelos.conteo
    deps:
      - src/modelos/conteo.py
      - src/modelos/caracteristicas.py
      - data/procesado/panel.parquet
      - data/procesado/vecindad.parquet
    outs:
      - data/procesado/prediccion_conteo.parquet
      - reportes/modelos/conteo.json:
          cache: false

  modelo_clasificador:
    cmd: python -m src.modelos.clasificador
    deps:
      - src/modelos/clasificador.py
      - src/modelos/caracteristicas.py
      - data/procesado/panel.parquet
      - data/procesado/vecindad.parquet
    outs:
      - data/procesado/prediccion_clasificador.parquet
      - reportes/modelos/clasificador.json:
          cache: false
