package_name: modelo-riesgo
version: 0.0.2
empaquetado: '2026-11-23'
experimento: seguridad-vial-bogota-e3
tracking_uri: sqlite:///mlflow.db
criterio: Se toma la corrida lider por la metrica principal. Por bootstrap pareado
  se calcula el intervalo del 95 % de la diferencia con cada rival. Las que contienen
  el cero son indistinguibles de la lider, y entre esas se elige la de menor complejidad.
modelos:
  conteo:
    archivo: modelo-riesgo-conteo0.0.2.txt
    corrida: lightgbm_poisson_h15_lr0.1_m100
    arboles: 250
    variables: 28
    metricas_validacion:
      captura_top_1_pct: 20.83
      captura_top_2_pct: 30.19
      captura_top_5_pct: 45.96
      captura_top_10_pct: 58.81
      auc_roc: 0.8282
      tarea: conteo
      complejidad: 15
  clasificacion:
    archivo: modelo-riesgo-clasificacion0.0.2.txt
    corrida: lightgbm_binario_h15_lr0.1_m300
    arboles: 250
    variables: 28
    metricas_validacion:
      captura_top_1_pct: 20.81
      captura_top_2_pct: 29.78
      captura_top_5_pct: 45.85
      captura_top_10_pct: 58.68
      auc_roc: 0.8274
      tarea: clasificacion
      complejidad: 15
alpha_nb2: 0.3485
target: graves
offset: log_long_km
test_data_file: muestra_2021.csv
anio_entrenamiento:
- 2016
- 2020
anio_validacion: 2021
anio_pronostico: 2022
no_son_variables:
- CIV
- anio_ref
- log_long_km
- factor_eb
features:
- const
- hist_media_log
- rezago1_log
- vecinos_hist_log
- vecinos_rezago1_log
- vecinos_n
- log_km
- carriles
- vel_reg
- vel_faltante
- tendencia
- pandemia
- post_kilometros_demarcados
- post_paso_peatonal
- post_senalizacion
- post_trafico_calmado
- post_zona_escolar
- tratado_kilometros_demarcados
- tratado_paso_peatonal
- tratado_senalizacion
- tratado_trafico_calmado
- tratado_zona_escolar
- clase_1
- clase_2
- clase_4
- clase_5
- clase_6
- clase_7
